<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f4f1eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="一口一停">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css?v=2">
  <title>一口一停 · 进食节奏计数器</title>
</head>
<body>
  <div class="app-shell">
    <header class="page-header">
      <div>
        <p class="eyebrow" id="page-eyebrow">TODAY</p>
        <h1 id="page-title">今日饮食</h1>
      </div>
      <p class="header-date" id="header-date"></p>
    </header>

    <main>
      <section class="view is-active" id="today-view" data-view="today">
        <article class="hero-total">
          <span>今日总热量</span>
          <strong><span id="today-total-calories">0</span><small> kcal</small></strong>
          <p><span id="today-meal-count">0</span> 次进食 · <span id="today-bite-count">0</span> 口</p>
        </article>
        <div class="section-row">
          <h2>今日记录</h2><span id="today-record-count">0 条</span>
        </div>
        <div class="record-list" id="today-records"></div>
      </section>

      <section class="view" id="start-view" data-view="start" hidden>
        <div id="template-picker-panel">
          <p class="lead">选一个计数器，开始这次进食。</p>
          <div class="template-start-grid" id="start-template-list"></div>
        </div>
        <div class="session-panel" id="session-panel" hidden>
          <div class="session-topline">
            <button class="text-button" id="session-back" type="button">退出本次</button>
            <span id="session-template-name"></span>
            <button class="text-button danger-text" id="session-end" type="button">结束</button>
          </div>
          <div class="session-summary">
            <div><span>当前阶段</span><strong id="session-stage-label">第1阶段</strong></div>
            <div><span>本次累计</span><strong><b id="session-total-bites">0</b>口</strong></div>
          </div>
          <div class="counter-zone" id="counter-zone">
            <p class="counter-status" id="counter-status">最多5口</p>
            <p class="counter-number"><span id="current-bites">0</span><small> / <span id="stage-bite-limit">5</span>口</small></p>
            <button class="bite-button" id="bite-button" type="button">+1口</button>
          </div>
          <div class="waiting-zone" id="waiting-zone" hidden>
            <p class="waiting-label" id="waiting-label">休息一下</p>
            <strong class="countdown" id="countdown">05:00</strong>
            <button class="primary-action" id="next-stage-button" type="button" hidden>进入下一阶段</button>
          </div>
          <div class="session-actions">
            <button id="undo-bite" type="button">撤销上一口</button>
            <button id="edit-bites" type="button">修改当前口数</button>
            <button id="pause-session" type="button">暂停</button>
            <button id="skip-wait" type="button" hidden>跳过等待</button>
          </div>
        </div>
      </section>

      <section class="view" id="templates-view" data-view="templates" hidden>
        <div class="section-row top-row">
          <p class="lead">每个模板都可以拥有任意数量的阶段。</p>
          <button class="round-add" id="new-template" type="button" aria-label="新建计数器">＋</button>
        </div>
        <div class="template-manage-list" id="template-manage-list"></div>
      </section>

      <section class="view" id="history-view" data-view="history" hidden>
        <div class="history-date-row">
          <button id="history-prev" type="button" aria-label="前一天">‹</button>
          <label><span>查看日期</span><input id="history-date" type="date"></label>
          <button id="history-next" type="button" aria-label="后一天">›</button>
        </div>
        <div class="history-stats">
          <div><span>总热量</span><strong id="history-calories">0</strong><small>kcal</small></div>
          <div><span>进食次数</span><strong id="history-count">0</strong><small>次</small></div>
          <div><span>总口数</span><strong id="history-bites">0</strong><small>口</small></div>
        </div>
        <article class="trend-card">
          <div class="metric-tabs" id="metric-tabs">
            <button class="is-active" type="button" data-metric="calories">热量</button>
            <button type="button" data-metric="count">次数</button>
            <button type="button" data-metric="bites">口数</button>
          </div>
          <canvas id="trend-chart" aria-label="最近七天饮食趋势"></canvas>
        </article>
        <div class="section-row"><h2>当日记录</h2><span id="history-record-count">0 条</span></div>
        <div class="record-list" id="history-records"></div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="主要页面">
      <button class="nav-button is-active" type="button" data-target="today"><span>●</span><b>今日</b></button>
      <button class="nav-button" type="button" data-target="start"><span>＋</span><b>开始</b></button>
      <button class="nav-button" type="button" data-target="templates"><span>▤</span><b>计数器</b></button>
      <button class="nav-button" type="button" data-target="history"><span>↗</span><b>历史</b></button>
    </nav>
  </div>

  <dialog id="template-dialog">
    <form id="template-form">
      <div class="dialog-heading"><div><p class="eyebrow">COUNTER</p><h2 id="template-dialog-title">新建计数器</h2></div><button class="icon-close" type="button" data-close-template>×</button></div>
      <label class="field"><span>模板名称</span><input id="template-name" type="text" maxlength="30" required placeholder="例如：正餐"></label>
      <div class="stage-heading"><h3>进食阶段</h3><button id="add-stage" type="button">＋ 新增阶段</button></div>
      <div class="stage-editor-list" id="stage-editor-list"></div>
      <label class="toggle-row"><input id="allow-append" type="checkbox"><span>完成全部阶段后允许继续追加</span></label>
      <div class="append-settings" id="append-settings" hidden>
        <label class="field"><span>每次追加允许</span><span class="with-unit"><input id="append-bites" type="number" min="1" max="999" inputmode="numeric"><b>口</b></span></label>
        <label class="field"><span>追加后等待</span><span class="with-unit"><input id="append-wait" type="number" min="0" max="999" inputmode="numeric"><b>分钟</b></span></label>
      </div>
      <div class="dialog-actions"><button type="button" class="secondary" data-close-template>取消</button><button type="submit" class="primary">保存计数器</button></div>
    </form>
  </dialog>

  <dialog id="finish-dialog">
    <form id="finish-form">
      <div class="dialog-heading"><div><p class="eyebrow">FINISH</p><h2>保存这次进食</h2></div><button class="icon-close" type="button" data-cancel-finish>×</button></div>
      <div class="finish-auto" id="finish-auto-summary"></div>
      <label class="field"><span>食物名称</span><input id="finish-food" type="text" maxlength="80" placeholder="例如：巧克力蛋糕"></label>
      <label class="field"><span>热量</span><span class="with-unit"><input id="finish-calories" type="number" min="0" max="99999" inputmode="decimal"><b>kcal</b></span></label>
      <label class="field"><span>备注</span><textarea id="finish-notes" maxlength="300" placeholder="选填"></textarea></label>
      <div class="dialog-actions"><button type="button" class="secondary" data-cancel-finish>继续计数</button><button type="submit" class="primary">保存记录</button></div>
    </form>
  </dialog>

  <dialog id="bites-dialog">
    <form id="bites-form">
      <div class="dialog-heading"><div><p class="eyebrow">ADJUST</p><h2>修改当前口数</h2></div><button class="icon-close" type="button" data-close-bites>×</button></div>
      <label class="field"><span id="bites-input-label">当前阶段口数</span><span class="with-unit"><input id="bites-input" type="number" min="0" inputmode="numeric" required><b>口</b></span></label>
      <div class="dialog-actions"><button type="button" class="secondary" data-close-bites>取消</button><button type="submit" class="primary">确定修改</button></div>
    </form>
  </dialog>

  <dialog id="record-dialog">
    <form id="record-form">
      <div class="dialog-heading"><div><p class="eyebrow">EDIT</p><h2>编辑饮食记录</h2></div><button class="icon-close" type="button" data-close-record>×</button></div>
      <label class="field"><span>食物名称</span><input id="record-food" type="text" maxlength="80"></label>
      <div class="two-fields">
        <label class="field"><span>总口数</span><span class="with-unit"><input id="record-bites" type="number" min="0" max="9999" inputmode="numeric"><b>口</b></span></label>
        <label class="field"><span>热量</span><span class="with-unit"><input id="record-calories" type="number" min="0" max="99999" inputmode="decimal"><b>kcal</b></span></label>
      </div>
      <div class="two-fields"><label class="field"><span>开始时间</span><input id="record-start" type="time"></label><label class="field"><span>结束时间</span><input id="record-end" type="time"></label></div>
      <label class="field"><span>备注</span><textarea id="record-notes" maxlength="300"></textarea></label>
      <div class="dialog-actions"><button type="button" class="secondary" data-close-record>取消</button><button type="submit" class="primary">保存修改</button></div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js?v=2"></script>
  <script>if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('./sw.js').catch(() => {});</script>
</body>
</html>
